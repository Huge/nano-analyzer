  <title>Illustration: the Yopass Sign in button and what could go wrong before the fix</title>
  <desc>An illustrative mock-up drawn from the Yopass source code, not a real screenshot. Window 1: the Yopass navbar with OIDC enabled, showing a Sign in link next to Upload, Requests and Receipts. Window 2: what could go wrong before the fix. The identity provider reports email_verified false, yet the user is signed in anyway, as the Sign out link in the navbar shows.</desc>
