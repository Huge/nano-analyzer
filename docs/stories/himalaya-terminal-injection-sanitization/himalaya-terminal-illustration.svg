<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img"
     font-family="JetBrains Mono, Menlo, Monaco, 'Courier New', monospace">
  <title>Illustration: Himalaya terminal escape injection and BiDi spoofing defense</title>
  <desc>A terminal illustration displaying the vulnerability in Himalaya email listing (OSC 52 clipboard injection and BiDi filename disguise), the sanitization in pimalaya-cli 0.2.6 co-authored by Huge, and the merged pull request by Clément Douin.</desc>
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <linearGradient id="term-header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e232d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window with Shadow -->
  <g filter="url(#sh)">
    <rect x="40" y="30" width="1120" height="750" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  </g>

  <!-- Terminal Header / Titlebar -->
  <path d="M40 44a14 14 0 0 1 14-14h1092a14 14 0 0 1 14 14v40H40z" fill="url(#term-header)"/>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="68" cy="57" r="6.5" fill="#ff5f56"/>
  <circle cx="90" cy="57" r="6.5" fill="#ffbd2e"/>
  <circle cx="112" cy="57" r="6.5" fill="#27c93f"/>

  <!-- Title -->
  <text x="600" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#8b949e" font-family="Inter, -apple-system, sans-serif">
    pimalaya/himalaya#771 — Terminal Escape Injection &amp; BiDi Sanitization
  </text>

  <!-- Terminal Content -->
  <!-- Prompt 1 -->
  <g transform="translate(70, 118)">
    <text font-size="14" fill="#58a6ff" font-weight="600">user@desktop:~$</text>
    <text x="145" font-size="14" fill="#e6edf3">himalaya envelope list</text>
  </g>

  <!-- Table Demonstration Before / After -->
  <rect x="70" y="136" width="1060" height="195" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <g transform="translate(90, 164)" font-size="13">
    <!-- Header -->
    <text fill="#8b949e" font-weight="700">ID   FLAGS   SUBJECT                                     FROM              DATE</text>
    <text y="18" fill="#30363d">─────────────────────────────────────────────────────────────────────────────────────────────</text>

    <!-- Row 1: Attack scenario -->
    <g transform="translate(0, 42)">
      <rect x="-10" y="-14" width="1040" height="34" rx="4" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
      <text fill="#ff7b72" font-weight="700">142</text>
      <text x="45" fill="#8b949e"> </text>
      <text x="105" fill="#ff7b72">Urgent Invoice \x1b]52;c;... (OSC 52 clipboard write)</text>
      <text x="540" fill="#ff7b72">attacker@evil.com</text>
      <text x="730" fill="#8b949e">10:42 AM</text>
      <text x="830" fill="#f85149" font-weight="700">[EXPLOIT: raw escape]</text>
    </g>

    <!-- Row 2: BiDi filename spoofing -->
    <g transform="translate(0, 84)">
      <rect x="-10" y="-14" width="1040" height="34" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text fill="#e3b341" font-weight="700">143</text>
      <text x="45" fill="#8b949e"> </text>
      <text x="105" fill="#e3b341">Attachment: invoice\u{202e}fdp.exe &rarr; displays as "invoiceexe.pdf"</text>
      <text x="730" fill="#8b949e">10:45 AM</text>
      <text x="830" fill="#d29922" font-weight="700">[BIDI SPOOFING]</text>
    </g>

    <!-- Row 3: Sanitized with fix -->
    <g transform="translate(0, 126)">
      <rect x="-10" y="-14" width="1040" height="34" rx="4" fill="rgba(46, 160, 67, 0.14)" stroke="rgba(46, 160, 67, 0.35)" stroke-width="1"/>
      <text fill="#3fb950" font-weight="700">142</text>
      <text x="45" fill="#8b949e"> </text>
      <text x="105" fill="#3fb950">Urgent Invoice [sanitized] (control chars stripped)</text>
      <text x="540" fill="#7ee787">attacker@evil.com</text>
      <text x="730" fill="#8b949e">10:42 AM</text>
      <text x="830" fill="#3fb950" font-weight="700">[SANITIZED: safe]</text>
    </g>
  </g>

  <!-- pimalaya-cli Ecosystem Shared Crate Callout -->
  <g transform="translate(70, 350)">
    <rect width="1060" height="155" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <g transform="translate(20, 28)">
      <text font-size="12.5" fill="#58a6ff" font-weight="700" font-family="Inter, sans-serif">CRATE RELEASE · pimalaya-cli 0.2.6 (crates.io)</text>
      <text y="24" font-size="14" fill="#e6edf3" font-weight="600">pimalaya_cli::table::sanitize(input) &mdash; Co-authored by Huge &amp; Clément Douin</text>
      <text y="46" font-size="13" fill="#8b949e">Extracted to shared core crate to protect the entire suite: <tspan fill="#79c0ff">himalaya</tspan> (email), <tspan fill="#79c0ff">cardamum</tspan> (contacts), <tspan fill="#79c0ff">calendula</tspan> (calendar).</text>
      <text y="70" font-size="12.5" fill="#7ee787" font-weight="500">+ Strips C0 / C1 controls, DEL, ANSI / OSC escape sequences</text>
      <text y="92" font-size="12.5" fill="#7ee787" font-weight="500">+ Replaces Unicode BiDi overrides (U+202A–202E, U+2066–2069) preventing filename spoofing</text>
    </g>
  </g>

  <!-- GitHub Maintainer Review Box -->
  <g transform="translate(70, 525)">
    <rect width="1060" height="150" rx="8" fill="#131d2b" stroke="#1f6feb" stroke-width="1.2"/>
    <g transform="translate(24, 30)">
      <circle cx="16" cy="16" r="16" fill="#1f6feb" fill-opacity="0.25"/>
      <text x="16" y="21" text-anchor="middle" font-size="14" fill="#58a6ff" font-weight="700" font-family="Inter, sans-serif">S</text>
      <text x="46" y="14" font-size="13.5" font-weight="700" fill="#e6edf3" font-family="Inter, sans-serif">
        soywod <tspan font-weight="400" fill="#8b949e">(Clément Douin, maintainer of Himalaya &amp; Pimalaya)</tspan>
        <tspan font-weight="400" fill="#58a6ff"> · GitHub PR #771</tspan>
      </text>
      <text x="46" y="42" font-size="13.5" fill="#c9d1d9" font-family="Inter, sans-serif" line-height="1.5">
        “Thanks for the report and the clear write-up, the problem is real. Since cardamum and calendula share the
      </text>
      <text x="46" y="64" font-size="13.5" fill="#c9d1d9" font-family="Inter, sans-serif">
        same tables, I moved the function into pimalaya-cli and credited you as co-author. [...] Merging. 🚀”
      </text>
    </g>
  </g>

  <!-- Status Bar at bottom -->
  <rect x="40" y="694" width="1120" height="86" rx="0" fill="#161b22"/>
  <path d="M40 780a14 14 0 0 0 14 14h1092a14 14 0 0 0 14-14v-86H40z" fill="#161b22"/>
  <line x1="40" y1="694" x2="1160" y2="694" stroke="#30363d" stroke-width="1"/>
  <g transform="translate(68, 738)" font-size="13" font-weight="600" fill="#8b949e" font-family="Inter, sans-serif">
    <text><tspan fill="#3fb950">● MERGED</tspan> into master · Commit <tspan fill="#e6edf3">80a99a9</tspan> · Tests: <tspan fill="#3fb950">cargo test (clean)</tspan> · <tspan fill="#58a6ff">Cairn spec updated</tspan></text>
  </g>
</svg>
